# AC1 pictures one Application per service (apps/staging/<service>/). What's
# actually here is one Application for the whole umbrella chart — see this
# repo's README for why. "automated: prune: true, selfHeal: true" is AC3/AC5:
# a merge to this repo syncs staging within ArgoCD's default 3-minute poll,
# and a manual kubectl drift gets reverted automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stampede-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stampede-io/STAM-platform.git
    targetRevision: Dev
    path: platform/charts/stampede
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # STAM-64 (code review): selfHeal: true would otherwise fight Argo
  # Rollouts' manual blueGreen promotion on gateway. The Rollout
  # controller writes spec.paused: true onto the live object while a
  # preview waits for `kubectl argo rollouts promote` -- a spec field,
  # not status, which Helm's template never sets (implicit false). Without
  # this, ArgoCD sees that as drift and selfHeal reverts it, silently
  # auto-promoting every preview and defeating autoPromotionEnabled: false.
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/paused
